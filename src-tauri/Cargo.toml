[package]
name = "enspirewrite"
version = "0.1.0"
description = "Minimalist, tactile, vintage-typewriter-inspired journaling, notes, and diary application"
authors = ["Enspirewrite Team"]
edition = "2021"

[lib]
name = "enspirewrite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
